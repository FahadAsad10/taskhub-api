name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub
          POSTGRES_DB: taskhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskhub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://taskhub:taskhub@localhost:5432/taskhub_test
      DATABASE_URL: postgresql+psycopg://taskhub:taskhub@localhost:5432/taskhub_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations apply and roll back cleanly
        run: alembic upgrade head && alembic downgrade base
      - name: Tests (PostgreSQL)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t taskhub-api .
      - name: Smoke test with docker compose
        run: |
          docker compose up -d --build
          for i in $(seq 30); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker compose logs api
          exit 1
